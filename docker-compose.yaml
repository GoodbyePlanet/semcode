services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      # Set QDRANT_API_KEY in .env to require an `api-key` header on every request.
      # semcode reads the same value from .env, so both sides stay in sync. Left
      # empty (the default), Qdrant runs without auth. The healthcheck below is a raw
      # TCP check, so it keeps working with auth on.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Jina Code V2 served by HuggingFace Text Embeddings Inference. Default
  # embedding backend — only started when the `jina` profile is active.
  # For hosted providers (Voyage / OpenAI) or a local Ollama install, omit
  # --profile jina and set EMBEDDINGS_PROVIDER + the relevant API key in .env.
  jina-embeddings:
    profiles: [jina]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    platform: linux/amd64
    container_name: jina-embeddings
    command: --model-id jinaai/jina-embeddings-v2-base-code
    volumes:
      - embeddings_cache:/data
    ports:
      - "127.0.0.1:8087:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  semcode:
    build: .
    platform: linux/amd64
    # Published on the host's loopback only, like every port in this file: nothing in
    # this stack is authenticated, so binding to all interfaces would let anyone on the
    # network search the indexed code and trigger /reindex. Drop the 127.0.0.1: prefix
    # only when you deliberately expose the server, and put auth in front of it first.
    ports:
      - "127.0.0.1:8090:8090"
    env_file:
      - .env
    environment:
      JINA_URL: http://jina-embeddings:80
      QDRANT_URL: http://qdrant:6333
      # Same interpolation as the qdrant service (shell env, then .env), so the two can't
      # disagree. Empty means no key, which matches Qdrant running without auth.
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      # 0.0.0.0 is required inside the container so Docker's port forwarding can reach
      # the server; host-side exposure is controlled by the loopback-only `ports:` above.
      MCP_HOST: 0.0.0.0
      FASTEMBED_CACHE_PATH: /fastembed_cache
    depends_on:
      qdrant:
        condition: service_healthy
      jina-embeddings:
        condition: service_healthy
        required: false
    # No config.yaml mount here on purpose — this base file works standalone for
    # ad-hoc-registration-only setups (see examples/github-actions). If you also want
    # curated services from config.yaml, layer docker-compose.config-yaml.yml on top
    # (see the `-with-config` Makefile targets) instead of editing this file — bind-mounting
    # a config.yaml that doesn't exist on the host silently creates an empty directory
    # there, which breaks the server at startup.
    volumes:
      - fastembed_cache:/fastembed_cache

volumes:
  qdrant_data:
  embeddings_cache:
  fastembed_cache:
