services:
  - name: my-service
    source: github
    repo: my-org/my-repo
    ref: main

  - name: my-service-with-submodule
    repo: my-org/my-monorepo
    ref: main
    root: submodule-dir
    exclude:
      - "**/test/**"
      - "**/target/**"

  - name: my-gitlab-service
    source: gitlab                 # needs GITLAB_TOKEN for private projects
    repo: my-group/my-subgroup/my-project
    ref: main